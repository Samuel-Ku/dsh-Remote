<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DSH Remote</title>
  <script>(function(){try{var t=localStorage.getItem('dshTheme');if(t!=='default'&&t!=='dark'&&t!=='light'&&t!=='neutral'&&t!=='mono'&&t!=='fish'){t='fish'}}catch(e){t='fish'}document.documentElement.setAttribute('data-theme',t)})()</script>
  <link rel="stylesheet" href="theme-vars.css">
  <link rel="stylesheet" href="setup.css">
  <link rel="stylesheet" href="insights.css">
  <link rel="stylesheet" href="remote-ui.css">
  <link rel="stylesheet" href="doctor.css">
  <link rel="stylesheet" href="skins/blue-fish/skin.css">
  <style>html[data-theme="light"],html[data-theme="neutral"],html[data-theme="fish"]{color-scheme:light}.plugin-lang{min-width:44px;height:32px;padding:0 10px;flex:none;border:1px solid var(--dsr-line);border-radius:10px;background:var(--dsr-panel);color:var(--dsr-muted);font-size:11px;font-weight:700}.plugin-lang:hover,.plugin-lang:focus-visible{color:var(--dsr-text);border-color:var(--dsr-accent-line);background:var(--dsr-accent-soft)}</style>
</head>
<body class="remote-panel-body">
  <main class="plugin-shell" data-motion-view>
    <header class="plugin-head">
      <div class="plugin-brand"><span class="plugin-brand-mark" aria-hidden="true"><morph-icon id="plugin-toggle-icon" data-morph-closed="M8 3h8v18H8zM11 17h2" data-morph-open="M8 3h8v18H8zM10 11l2 2 4-4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 3h8v18H8zM11 17h2"/></svg></morph-icon></span><span class="plugin-brand-copy"><span class="plugin-brand-name">DSH Remote</span><span id="plugin-host" class="plugin-brand-sub" data-i18n="brandSub">本地控制器</span></span></div>
      <button id="plugin-lang" class="plugin-lang" type="button" data-i18n-title="langTitle" title="切换语言">EN</button>
      <button id="plugin-close" class="plugin-close" type="button" data-i18n-aria="closePanel" data-i18n-title="closePanel" aria-label="关闭面板" title="关闭面板">×</button>
    </header>
    <section id="plugin-hero" class="plugin-hero" aria-live="polite">
      <div id="plugin-status" class="plugin-status" data-i18n="statusConnecting">正在检查连接</div>
      <div id="plugin-status-desc" class="plugin-status-desc" data-i18n="statusConnectingDesc">读取主机与网关状态</div>
      <div class="plugin-status-line"><span id="plugin-status-meta"></span></div>
      <div class="plugin-primary-actions">
        <button id="plugin-primary" class="plugin-primary" type="button" data-i18n="primaryConsole">打开控制台</button>
        <button id="plugin-doctor" class="plugin-primary plugin-doctor-button" type="button" data-i18n="doctorAction">AI 排查问题</button>
      </div>
    </section>
    <div id="plugin-health-path" class="remote-health-path" data-i18n-aria="healthPath" aria-label="连接链路"></div>
    <div id="plugin-error" class="plugin-error hidden" role="alert"></div>
    <section class="plugin-actions" data-i18n-aria="actionsLabel" aria-label="快速操作">
      <button id="plugin-pair" class="plugin-action" type="button" data-i18n="pairAction">已有 App，去配对</button>
      <button id="plugin-console" class="plugin-action" type="button" data-i18n="fullConsole">完整控制台</button>
    </section>
    <div id="plugin-setup" hidden></div>
    <section class="plugin-usage" aria-labelledby="plugin-usage-title">
      <div class="remote-section-head"><h3 id="plugin-usage-title" data-i18n="quotaTitle">额度与余额</h3><button id="plugin-usage-refresh" class="remote-link" type="button" data-i18n="refresh">刷新</button></div>
      <div id="plugin-cost-data" aria-live="polite"><p class="remote-empty" data-i18n="quotaLoading">正在读取额度…</p></div>
    </section>
    <section class="remote-connections" aria-labelledby="plugin-online-title">
      <div class="remote-section-head"><h3 id="plugin-online-title" data-i18n="onlineTitle">在线连接</h3></div>
      <div id="plugin-client-list"><p class="remote-empty" data-i18n="onlineLoading">正在读取连接列表…</p></div>
    </section>
    <footer class="plugin-foot"><span id="plugin-version">—</span><a id="plugin-about" href="/remote/admin/#remote/settings" target="_blank" rel="noopener" data-i18n="about">关于与支持</a></footer>
  </main>
